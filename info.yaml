# Tiny Tapeout project information
project:
  title:        "JS Protocol Emulator"      # Project title
  author:       "Dailing Wu"      # Your name
  discord:      "dailingw"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A simple protocol emulator for jane street competition"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_protocolemu_dailingw"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_protocolemu_dailingw.sv"
    - "vendor/ibex/rtl/ibex_pkg.sv"
    - "vendor/ibex/rtl/ibex_cheriot_pkg.sv"
    - "vendor/ibex/vendor/lowrisc_ip/ip/prim_generic/rtl/prim_ram_1p_pkg.sv"
    - "vendor/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_secded_pkg.sv"
    - "vendor/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_util_pkg.sv"
    - "vendor/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_cipher_pkg.sv"
    - "vendor/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_count_pkg.sv"
    - "vendor/ibex/vendor/lowrisc_ip/ip/prim/rtl/prim_mubi_pkg.sv"
    - "vendor/ibex/vendor/lowrisc_ip/ip/prim_generic/rtl/prim_buf.sv"
    - "vendor/ibex/vendor/lowrisc_ip/ip/prim_generic/rtl/prim_clock_gating.sv"
    - "vendor/ibex/rtl/ibex_alu.sv"
    - "vendor/ibex/rtl/ibex_compressed_decoder.sv"
    - "vendor/ibex/rtl/ibex_controller.sv"
    - "vendor/ibex/rtl/ibex_counter.sv"
    - "vendor/ibex/rtl/ibex_cs_registers.sv"
    - "vendor/ibex/rtl/ibex_csr.sv"
    - "vendor/ibex/rtl/ibex_decoder.sv"
    - "generated/ibex_ex_block.sv"
    - "vendor/ibex/rtl/ibex_fetch_fifo.sv"
    - "vendor/ibex/rtl/ibex_id_stage.sv"
    - "vendor/ibex/rtl/ibex_if_stage.sv"
    - "vendor/ibex/rtl/ibex_load_store_unit.sv"
    - "vendor/ibex/rtl/ibex_prefetch_buffer.sv"
    - "vendor/ibex/rtl/ibex_wb_stage.sv"
    - "vendor/ibex/rtl/ibex_register_file_ff.sv"
    - "vendor/ibex/rtl/ibex_core.sv"
    - "generated/ibex_top.sv"
    - "ibex_area_core.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "byte data / instruction grant"
  ui[1]: "byte data / instruction response valid"
  ui[2]: "byte data / data grant"
  ui[3]: "byte data / data response valid"
  ui[4]: "byte data / instruction error"
  ui[5]: "byte data / data error"
  ui[6]: "byte data / external interrupt"
  ui[7]: "byte data / debug request"

  # Outputs
  uo[0]: "observation byte bit 0"
  uo[1]: "observation byte bit 1"
  uo[2]: "observation byte bit 2"
  uo[3]: "observation byte bit 3"
  uo[4]: "observation byte bit 4"
  uo[5]: "observation byte bit 5"
  uo[6]: "observation byte bit 6"
  uo[7]: "observation byte bit 7"

  # Bidirectional pins
  uio[0]: "response byte index 0"
  uio[1]: "response byte index 1"
  uio[2]: "response byte index 2"
  uio[3]: "response byte write enable"
  uio[4]: "observation selector 0"
  uio[5]: "observation selector 1"
  uio[6]: "observation selector 2"
  uio[7]: "observation selector 3"

# Do not change!
yaml_version: 6
