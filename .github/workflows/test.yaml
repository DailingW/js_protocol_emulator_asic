name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Ibex RTL needs SystemVerilog support and a recent Verilator. Use the
      # suite's bundled cocotb/Python for both Verilator and Icarus tests.
      - name: Install simulation tools
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          python-override: true

      - name: Run tests
        run: |
          cd test
          make -f Makefile.sram
          make -f Makefile.sram SRAM_TEST=logic
          make
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/results.xml
            test/sim_build/sram_banks/results.xml
            test/sim_build/sram_logic/results.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/sim_build/sram_banks/results.xml
            test/sim_build/sram_logic/results.xml
            test/output/*
